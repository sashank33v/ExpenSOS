<!DOCTYPE html>
<html lang="{{ language }}" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ExpenSOS{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --brand-400: #22d3ee;
            --brand-500: #06b6d4;
            --brand-600: #0891b2;
            --brand-700: #0e7490;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-700: #374151;
            --gray-900: #111827;
            --dark-bg: #09090b;
            --dark-card: #111113;
            --dark-border: #27272a;
            --dark-muted: #71717a;
            --red-500: #ef4444;
            --green-400: #4ade80;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--gray-50);
            color: var(--gray-900);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow: hidden;
            transition: background-color .3s, color .3s;
        }

        html.dark body {
            background: var(--dark-bg);
            color: #e4e4e7;
        }

        /* Ambient glows */
        body::before {
            content: '';
            position: fixed;
            top: -8%;
            left: -6%;
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, rgba(6, 182, 212, .11) 0%, transparent 70%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -8%;
            right: -6%;
            width: 38%;
            height: 38%;
            background: radial-gradient(circle, rgba(168, 85, 247, .07) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Container */
        .auth-container {
            width: 100%;
            max-width: 444px;
            padding: 24px 16px;
            position: relative;
            z-index: 10;
            animation: slideUp .5s cubic-bezier(.4, 0, .2, 1) both;
        }

        /* Logo */
        .auth-logo {
            text-align: center;
            margin-bottom: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 11px;
        }

        .auth-logo a {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 11px;
        }

        .auth-logo-icon {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            background: linear-gradient(135deg, var(--brand-700) 0%, var(--brand-400) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(6, 182, 212, .42);
            transition: transform .28s, box-shadow .28s;
        }

        .auth-logo a:hover .auth-logo-icon {
            transform: scale(1.06);
            box-shadow: 0 12px 32px rgba(6, 182, 212, .58);
        }

        .auth-logo-name {
            font-size: 27px;
            font-weight: 900;
            letter-spacing: -.9px;
            color: var(--gray-900);
        }

        html.dark .auth-logo-name {
            color: #fff;
        }

        .auth-logo-name em {
            font-style: normal;
            color: var(--brand-500);
        }

        /* Flash */
        .flash {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 14px;
            border: 1px solid transparent;
        }

        .flash.success {
            background: rgba(34, 197, 94, .09);
            color: #15803d;
            border-color: rgba(34, 197, 94, .22);
        }

        .flash.error {
            background: rgba(239, 68, 68, .09);
            color: #b91c1c;
            border-color: rgba(239, 68, 68, .22);
        }

        html.dark .flash.success {
            background: rgba(34, 197, 94, .10);
            color: var(--green-400);
        }

        html.dark .flash.error {
            background: rgba(239, 68, 68, .10);
            color: #f87171;
        }

        /* Card */
        .auth-card {
            background: #fff;
            border: 1px solid var(--gray-200);
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .08);
        }

        html.dark .auth-card {
            background: var(--dark-card);
            border-color: var(--dark-border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .48);
        }

        .auth-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -.5px;
            color: var(--gray-900);
            margin-bottom: 4px;
        }

        html.dark .auth-title {
            color: #fff;
        }

        .auth-subtitle {
            font-size: 14px;
            color: var(--gray-500);
            margin-bottom: 26px;
        }

        html.dark .auth-subtitle {
            color: var(--dark-muted);
        }

        /* Form */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 16px;
        }

        .form-label {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--gray-700);
        }

        html.dark .form-label {
            color: #d4d4d8;
        }

        .form-input {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            font-family: inherit;
            border: 1.5px solid var(--gray-300);
            border-radius: 11px;
            background: #fff;
            color: var(--gray-900);
            outline: none;
            transition: border-color .18s, box-shadow .18s;
        }

        html.dark .form-input {
            background: rgba(255, 255, 255, .04);
            border-color: var(--dark-border);
            color: #e4e4e7;
        }

        .form-input::placeholder {
            color: var(--gray-400);
        }

        html.dark .form-input::placeholder {
            color: var(--dark-muted);
        }

        .form-input:focus {
            border-color: var(--brand-500);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, .14);
        }

        .form-hint {
            font-size: 12px;
            color: var(--gray-400);
            margin-top: 2px;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: var(--brand-600);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all .2s;
            box-shadow: 0 4px 16px rgba(6, 182, 212, .32);
            margin-top: 6px;
        }

        .submit-btn:hover {
            background: var(--brand-500);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(6, 182, 212, .46);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Footer */
        .auth-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: var(--gray-500);
        }

        html.dark .auth-footer {
            color: var(--dark-muted);
        }

        .auth-footer a {
            color: var(--brand-600);
            font-weight: 600;
            margin-left: 4px;
        }

        html.dark .auth-footer a {
            color: var(--brand-400);
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .copyright {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: var(--gray-400);
        }

        html.dark .copyright {
            color: var(--dark-muted);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body data-theme="{{ theme }}">
    <div class="auth-container">
        <div class="auth-logo">
            <a href="/">
                <div class="auth-logo-icon">
                    <svg width="22" height="22" fill="none" stroke="white" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <span class="auth-logo-name">Expen<em>SOS</em></span>
            </a>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}{% for category, message in messages %}
        <div class="flash {{ 'success' if category in ['success','info'] else 'error' }}">{{ message }}</div>
        {% endfor %}{% endif %}
        {% endwith %}

        <div class="auth-card">
            {% block content %}{% endblock %}
        </div>

        <div class="copyright">ExpenSOS &copy; 2026 · Premium Financial Tracking</div>
    </div>

    <script>
        (function () {
            const t = document.body.getAttribute('data-theme');
            document.documentElement.classList.toggle('dark', t !== 'light');
        })();
    </script>
</body>

</html>
